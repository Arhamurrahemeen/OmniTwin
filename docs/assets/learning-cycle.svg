<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="The learning cycle: connect, see, break, ask, and back to the rig.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A8E95"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#02D0B1"/></marker></defs>
<rect width="1200" height="400" rx="14" fill="#0C0E11"/><rect x="10" y="10" width="1180" height="380" rx="8" fill="none" stroke="#2A2E35"/>
<path d="M216 110 C300 62 380 62 462 104" fill="none" stroke="#8A8E95" stroke-width="2.2" marker-end="url(#ar)"/><path d="M558 110 C640 62 720 62 802 104" fill="none" stroke="#8A8E95" stroke-width="2.2" marker-end="url(#ar)"/><path d="M898 110 C950 78 1000 78 1040 104" fill="none" stroke="#8A8E95" stroke-width="2.2" marker-end="url(#ar)"/>
<path d="M1080 330 C1060 392 200 392 170 300" fill="none" stroke="#02D0B1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ad)"/>
<text x="610" y="346" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="400" fill="#02D0B1" text-anchor="middle">fix it, and go again</text>
<circle cx="170" cy="130" r="46" fill="#1F2329" stroke="#6A97FF" stroke-width="2.5"/><text x="170" y="140" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="28" font-weight="500" fill="#6A97FF" text-anchor="middle">1</text><text x="170" y="212" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F1EE" text-anchor="middle">Connect</text><text x="170" y="240" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">One click, then pick</text><text x="170" y="264" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">your USB port.</text><circle cx="510" cy="130" r="46" fill="#1F2329" stroke="#3BA9D9" stroke-width="2.5"/><text x="510" y="140" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="28" font-weight="500" fill="#3BA9D9" text-anchor="middle">2</text><text x="510" y="212" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F1EE" text-anchor="middle">See</text><text x="510" y="240" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">Your real rig, live,</text><text x="510" y="264" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">with its readings.</text><circle cx="850" cy="130" r="46" fill="#1F2329" stroke="#F5A524" stroke-width="2.5"/><text x="850" y="140" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="28" font-weight="500" fill="#F5A524" text-anchor="middle">3</text><text x="850" y="212" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F1EE" text-anchor="middle">Break it</text><text x="850" y="240" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">Unplug or miswire.</text><text x="850" y="264" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">The twin shows it.</text><circle cx="1085" cy="130" r="46" fill="#1F2329" stroke="#02D0B1" stroke-width="2.5"/><text x="1085" y="140" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="28" font-weight="500" fill="#02D0B1" text-anchor="middle">4</text><text x="1085" y="212" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F1EE" text-anchor="middle">Ask</text><text x="1085" y="240" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">The tutor explains,</text><text x="1085" y="264" font-family="Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B4B7BC" text-anchor="middle">only when asked.</text>
</svg>
